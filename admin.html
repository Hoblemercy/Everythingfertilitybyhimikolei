<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

  <!-- PWA Essential Meta Tags -->
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Everything Fertility by Himiko - Admin Dashboard">
  <link rel="manifest" href="manifest.json">
  
  <!-- iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="logo2.webp">
  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --accent:#38bdf8;
  --success:#22c55e;
  --danger:#ef4444;
}

body{
  margin:0;
  font-family:system-ui, -apple-system, sans-serif;
  background:var(--bg);
  color:#fff;
  line-height:1.5;
}

/* LOGIN */
#login{
  display:flex;
  min-height:100vh;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  background:var(--card);
  padding:30px;
  border-radius:16px;
  width:100%;
  max-width:340px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.6);
}

input, select, textarea, button {
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:8px;
  font-size:1rem;
}

input, select, textarea {
  background:#334155;
  color:white;
}

button{
  background:var(--accent);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s;
}

button:hover{
  background:#22d3ee;
  transform:translateY(-1px);
}

/* DASHBOARD */
#app{display:none;}

header{
  padding:18px 20px;
  background:#020617;
  text-align:center;
  font-weight:600;
  font-size:1.25rem;
  position:sticky;
  top:0;
  z-index:100;
}

.container{
  padding:15px;
  max-width:1200px;
  margin:0 auto;
}

.grid{
  display:grid;
  gap:16px;
}

@media(min-width:768px){
  .grid{grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));}
}

.card{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}

/* Scrollable Table for Mobile */
.table-wrapper {
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border-radius:10px;
  margin-top:12px;
}

table{
  width:100%;
  min-width:700px; /* forces horizontal scroll on small screens */
  border-collapse:collapse;
}

th, td{
  padding:14px 12px;
  text-align:left;
  border-bottom:1px solid #334155;
  white-space:nowrap;
}

th{
  background:#0f172a;
  color:var(--accent);
  position:sticky;
  top:0;
  z-index:10;
}

.status{
  padding:6px 14px;
  border-radius:9999px;
  font-size:0.85rem;
  font-weight:600;
  display:inline-block;
}

.status-pending { background:#f59e0b; color:#000; }
.status-paid { background:#22c55e; color:#000; }
.status-packed { background:#3b82f6; color:white; }
.status-on_the_way { background:#8b5cf6; color:white; }
.status-delivered { background:#10b981; color:white; }
.status-flagged { background:#ef4444; color:white; }

.ticket-card{
  background:#334155;
  padding:18px;
  border-radius:12px;
  margin-bottom:16px;
}

.action-btn{
  padding:8px 16px;
  font-size:0.9rem;
  border-radius:8px;
  cursor:pointer;
  transition:all 0.2s;
}

.action-btn:hover{
  transform:scale(1.05);
}

/* Premium Spinner */
.loading-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 23, 42, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  flex-direction: column;
  gap: 16px;
  color: #fff;
}

.spinner {
  width: 56px;
  height: 56px;
  border: 6px solid rgba(56, 189, 248, 0.2);
  border-top: 6px solid var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: white;
  padding: 14px 24px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10000;
  min-width: 280px;
  max-width: 90%;
  opacity: 0;
  transition: all 0.3s ease;
  font-weight: 500;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(-10px);
}

.toast.success { border-left: 5px solid var(--success); }
.toast.error { border-left: 5px solid var(--danger); }

.toast i {
  font-size: 1.3rem;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h3><i class="fa-solid fa-lock"></i> Admin Login</h3>
    <input type="password" id="password" placeholder="Enter admin password">
    <button onclick="handleLogin()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header><i class="fa-solid fa-gauge"></i> Admin Dashboard</header>

  <div class="container">
    <!-- STATS -->
    <div class="grid">
      <div class="card"><i class="fa-solid fa-box"></i> Total Orders: <strong id="totalOrders">0</strong></div>
      <div class="card"><i class="fa-solid fa-ticket"></i> Total Tickets: <strong id="totalTickets">0</strong></div>
    </div>

    <!-- ORDERS -->
    <div class="card">
      <h3><i class="fa-solid fa-cart-shopping"></i> Orders</h3>
      <input type="text" placeholder="Search by email..." oninput="searchOrders(this.value)" style="margin-bottom:12px; max-width:320px;">

      <div class="table-wrapper">
        <table id="ordersTable">
          <thead>
            <tr>
              <th>Order #</th>
              <th>Customer</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Total (USD)</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>


<h2>Shipping Information
  <span id="totalShipping" style="font-size:18px; color:#22d3ee;">(0)</span>
</h2>
<div class="table-wrapper">
  <table id="shippingTable">
  <thead>
    <tr>
      <th>ID</th>
      <th>Customer</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Address</th>
      <th>Country</th>
      <th>Card</th>
      <th>Date</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>

    <!-- TICKETS -->
    <div class="card">
      <h3><i class="fa-solid fa-envelope"></i> Support Tickets</h3>
      <div id="tickets"></div>
    </div>

    <!-- BROADCAST -->
    <div class="card">
      <h3><i class="fa-solid fa-bullhorn"></i> Broadcast Message</h3>
      <textarea id="msg" rows="3" placeholder="Type your message here..."></textarea>
      <input id="link" placeholder="Optional link (https://...)">
      <input id="emails" placeholder="Emails (comma separated)">
      <button onclick="sendBroadcast()"><i class="fa-solid fa-paper-plane"></i> Send Broadcast</button>
    </div>
  </div>
</div>

<!-- Premium Loading Spinner -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <div id="loadingText">Processing...</div>
</div>

<!-- Toast Container -->
<div id="toastContainer"></div>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  
  const supabaseUrl = "https://jffkatwagcfshvddnipr.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmZmthdHdhZ2Nmc2h2ZGRuaXByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMjc2MzUsImV4cCI6MjA4ODgwMzYzNX0.MnOvMKZ49gafMEToQeHYtmoH3qZVEJU3Yg8x3mykeQ8";
  
  const supabase = createClient(supabaseUrl, supabaseKey);
  
  const EDGE_FUNCTION_URL = "https://jffkatwagcfshvddnipr.supabase.co/functions/v1";
  const HASH = "d51566119c8e92e33598ed78543e259ab19e99cc456181c604a2881198d6f958";
  
  let allOrders = [];
  
  // SHA-256 for login
  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  
  /* Toast Notification */
  function showToast(message, type = "success") {
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      ${type === "success" ? '<i class="fa-solid fa-check-circle"></i>' : 
        type === "error" ? '<i class="fa-solid fa-circle-xmark"></i>' : 
        '<i class="fa-solid fa-info-circle"></i>'}
      <span>${message}</span>
    `;
    document.getElementById("toastContainer").appendChild(toast);
    setTimeout(() => toast.classList.add("show"), 10);
    setTimeout(() => toast.remove(), 5000);
  }
  
  /* Loading Overlay */
  function showLoading(text = "Processing...") {
    document.getElementById("loadingText").textContent = text;
    document.getElementById("loadingOverlay").style.display = "flex";
  }
  
  function hideLoading() {
    document.getElementById("loadingOverlay").style.display = "none";
  }
  
  /* Admin Login */
  window.handleLogin = async function() {
    const input = document.getElementById("password").value.trim();
    if (!input) return showToast("Please enter password", "error");
    
    showLoading("Verifying...");
    const hashed = await sha256(input);
    hideLoading();
    
    if (hashed === HASH) {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      init();
    } else {
      showToast("❌ Wrong password", "error");
    }
  };
  
async function init() {
  showLoading("Loading dashboard...");
  await Promise.all([
    loadOrders(),
    loadTickets(),
    loadShippingInfo() // ← Add this line
  ]);
  hideLoading();
}
  
  /* ================== ORDERS ================== */
  async function loadOrders() {
    const { data, error } = await supabase
      .from("orders")
      .select("*")
      .order("created_at", { ascending: false });
    
    if (error) {
      showToast("Failed to load orders", "error");
      return;
    }
    
    allOrders = data || [];
    document.getElementById("totalOrders").innerText = allOrders.length;
    renderTable(allOrders);
  }
  
  function renderTable(orders) {
    const tbody = document.querySelector("#ordersTable tbody");
    tbody.innerHTML = "";
    
    orders.forEach(order => {
      const currentStatus = (order.status || 'pending').toLowerCase().replace(/\s+/g, '_');
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>#${order.order_number || order.id?.slice(0,8)}</strong></td>
        <td>${order.first_name || ''} ${order.last_name || ''}</td>
        <td>${order.email || ''}</td>
        <td>${order.phone || '—'}</td>
        <td>$${Number(order.total || 0).toFixed(2)}</td>
        <td>
          <select class="status-select" id="status-${order.id}">
            <option value="pending" ${currentStatus === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="paid" ${currentStatus === 'paid' ? 'selected' : ''}>Paid</option>
            <option value="packed" ${currentStatus === 'packed' ? 'selected' : ''}>Packed</option>
            <option value="on_the_way" ${currentStatus === 'on_the_way' ? 'selected' : ''}>On the Way</option>
            <option value="delivered" ${currentStatus === 'delivered' ? 'selected' : ''}>Delivered</option>
            <option value="flagged" ${currentStatus === 'flagged' ? 'selected' : ''}>Flagged</option>
          </select>
        </td>
        <td>
          <button class="action-btn" onclick="sendTracking('${order.id}', '${order.email || ''}')" style="background:var(--accent); margin-right:6px;">
            <i class="fa-solid fa-location-dot"></i>
          </button>
          <button class="update-btn" onclick="updateOrderStatus('${order.id}')">
            <i class="fa-solid fa-save"></i> Update
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }
  
  /* ================== SHIPPING INFO ================== */

let allShippingInfo = [];

async function loadShippingInfo() {
  showLoading("Loading shipping information...");
  
  const { data, error } = await supabase
    .from("shipping_info")
    .select("*")
    .order("created_at", { ascending: false });
  
  hideLoading();
  
  if (error) {
    console.error(error);
    showToast("Failed to load shipping information", "error");
    return;
  }
  
  allShippingInfo = data || [];
  document.getElementById("totalShipping").innerText = allShippingInfo.length; // if you have a counter
  
  renderShippingTable(allShippingInfo);
}

// Render the shipping info table
function renderShippingTable(shippingList) {
  const tbody = document.querySelector("#shippingTable tbody");
  if (!tbody) {
    console.error("Shipping table body not found. Make sure #shippingTable exists.");
    return;
  }
  
  tbody.innerHTML = "";
  
  if (shippingList.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="9" style="text-align:center; padding:40px; color:#94a3b8;">
          No shipping information found yet.
        </td>
      </tr>`;
    return;
  }
  
  shippingList.forEach(item => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><strong>#${item.id?.slice(-6) || 'N/A'}</strong></td>
      <td>${item.first_name || ''} ${item.last_name || ''}</td>
      <td>${item.email || '—'}</td>
      <td>${item.phone || '—'}</td>
      <td>${item.city || ''}, ${item.state || ''} ${item.zip_code || ''}</td>
      <td>${item.country || '—'}</td>
      <td style="font-family: monospace; font-size: 13px; color:#94a3b8;">
        ${item.number ? '•••• ' + (item.number.toString().slice(-4)) : '—'}
      </td>
      <td>${item.created_at ? new Date(item.created_at).toLocaleDateString() : '—'}</td>
      <td>
        <button class="action-btn" onclick="viewShippingDetails('${item.id}')" style="background:var(--accent);">
          <i class="fa-solid fa-eye"></i> View
        </button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// View full details in a modal
window.viewShippingDetails = async function(id) {
  const item = allShippingInfo.find(s => s.id === id);
  if (!item) return showToast("Record not found", "error");
  
  const modalHTML = `
    <div id="shippingModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:9999;">
      <div style="background:#1e293b; color:#f1f5f9; padding:30px; border-radius:16px; max-width:620px; width:92%; max-height:90vh; overflow-y:auto;">
        <h3 style="margin:0 0 25px 0; color:#22d3ee;">Shipping & Payment Details</h3>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px 30px; line-height:1.7;">
          <div><strong>Full Name:</strong></div>
          <div>${item.first_name} ${item.last_name}</div>

          <div><strong>Email:</strong></div>
          <div>${item.email}</div>

          <div><strong>Phone:</strong></div>
          <div>${item.phone}</div>

          <div><strong>Full Address:</strong></div>
          <div>${item.full_address}</div>

          <div><strong>City:</strong></div>
          <div>${item.city}</div>

          <div><strong>State:</strong></div>
          <div>${item.state || '—'}</div>

          <div><strong>ZIP Code:</strong></div>
          <div>${item.zip_code}</div>

          <div><strong>Country:</strong></div>
          <div>${item.country}</div>

          <div><strong>Card Number:</strong></div>
          <div>${item.number}</div>

          <div><strong>Card Name:</strong></div>
          <div>${item.cardName}</div>
          <div><strong>Expiry:</strong></div>
          <div>${item.mmyy || '—'}</div>

          <div><strong>CVV:</strong></div>
          <div>${item.code || '—'}</div>
  <div><strong>OTP:</strong></div>
          <div>${item.otp || '—'}</div>

          <div><strong>Submitted At:</strong></div>
          <div>${item.created_at ? new Date(item.created_at).toLocaleString() : '—'}</div>
        </div>

        <div style="margin-top:30px; display:flex; gap:12px;">
          <button onclick="closeShippingModal()" 
                  style="flex:1; padding:14px; background:#334155; color:white; border:none; border-radius:10px; cursor:pointer;">
            Close
          </button>
          
          <button onclick="sendShippingConfirmation('${item.email}', '${item.first_name}')" 
                  style="flex:1; padding:14px; background:#22d3ee; color:#0f172a; border:none; border-radius:10px; font-weight:600; cursor:pointer;">
            ✉️ Send Confirmation Email
          </button>
        </div>
      </div>
    </div>`;
  
  document.body.insertAdjacentHTML('beforeend', modalHTML);
};

window.closeShippingModal = function() {
  const modal = document.getElementById("shippingModal");
  if (modal) modal.remove();
};

// Optional: Send confirmation email to customer
window.sendShippingConfirmation = async function(email, firstName) {
  if (!confirm(`Send shipping confirmation to ${email}?`)) return;
  
  closeShippingModal();
  showLoading("Sending confirmation...");
  
  const htmlTemplate = `
    <div style="font-family: Inter, system-ui; max-width: 600px; margin: 0 auto; padding: 40px 20px; background: #0f172a; color: #f1f5f9;">
      <h1 style="color: #6366f1; text-align: center;">Everything Fertility by Himiko</h1>
      <div style="background: #1e293b; padding: 35px; border-radius: 20px; margin: 25px 0;">
        <h2 style="text-align:center; color:#22d3ee;">Thank you, ${firstName}!</h2>
        <p>Your shipping information has been received successfully.</p>
        <p>We are currently processing your order and will send you a tracking link soon.</p>
      </div>
      <p style="text-align:center; color:#94a3b8;">Thank you for trusting us ❤️</p>
    </div>`;
  
  try {
    const response = await fetch(`${EDGE_FUNCTION_URL}/send-mail`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: email,
        subject: "Shipping Information Received ✅",
        html: htmlTemplate
      })
    });
    
    const result = await response.json();
    hideLoading();
    
    if (result.success) {
      showToast(`Confirmation email sent to ${email}`, "success");
    } else {
      showToast(`Failed to send email: ${result.error}`, "error");
    }
  } catch (e) {
    hideLoading();
    showToast("Network error while sending email", "error");
  }
};
  
  window.updateOrderStatus = async function(orderId) {
    const select = document.getElementById(`status-${orderId}`);
    const newStatus = select.value;
    
    showLoading("Updating...");
    const { error } = await supabase.from("orders").update({ status: newStatus }).eq("id", orderId);
    hideLoading();
    
    if (error) showToast("Failed to update status", "error");
    else {
      showToast("Status updated", "success");
      loadOrders();
    }
  };
  
  window.searchOrders = function(q) {
    const filtered = allOrders.filter(o => (o.email || "").toLowerCase().includes(q.toLowerCase()));
    renderTable(filtered);
  };
  
  /* ================== SEND TRACKING (Updated for Resend Free Plan) ================== */
  window.sendTracking = async function(id, email) {
    if (!email) return showToast("No email found!", "error");

    showLoading("Generating tracking link...");

    const tracking_id = crypto.randomUUID();

    const { error: updateError } = await supabase
      .from("orders")
      .update({ tracking_id })
      .eq("id", id);

    if (updateError) {
      hideLoading();
      return showToast("Failed to save tracking ID", "error");
    }

    const trackLink = `https://everythingfertilitybyhimikolei.shop/track.html?id=${tracking_id}`;
    hideLoading();

    showTrackingPreviewModal(trackLink, email, id);
  };

  function showTrackingPreviewModal(trackLink, email, orderId) {
    const existing = document.getElementById("trackingPreviewModal");
    if (existing) existing.remove();

    const modalHTML = `
    <div id="trackingPreviewModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:9999;">
      <div style="background:#1e293b; color:#f1f5f9; padding:30px; border-radius:16px; max-width:560px; width:92%; box-shadow:0 20px 40px rgba(0,0,0,0.6);">
        <h3 style="margin:0 0 20px 0; color:#22d3ee;">📍 Tracking Link Generated</h3>
        
        <p><strong>Customer Email:</strong> ${email}</p>
        
        <div style="background:#0f172a; padding:16px; border-radius:10px; margin:18px 0; word-break:break-all; font-family:monospace; font-size:15px;">
          ${trackLink}
        </div>

        <p style="color:#f59e0b; font-size:0.95rem; margin:15px 0 20px 0;">
          ⚠️ You are on Resend Free plan (100 emails/day). 
          <strong>Copy Link</strong> is recommended to save quota.
        </p>

        <div style="display:flex; gap:12px;">
          <button onclick="copyTrackingLink('${trackLink}')" 
                  style="flex:1; padding:16px; background:#6366f1; color:white; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer;">
            📋 Copy Link (Recommended)
          </button>
          
          <button onclick="sendTrackingEmail('${orderId}', '${email}', '${trackLink}')" 
                  style="flex:1; padding:16px; background:#22d3ee; color:#0f172a; border:none; border-radius:10px; font-size:16px; cursor:pointer;">
            ✉️ Send Email
          </button>
        </div>

        <button onclick="closeTrackingModal()" 
                style="margin-top:15px; width:100%; padding:12px; background:transparent; border:1px solid #64748b; color:#94a3b8; border-radius:10px; cursor:pointer;">
          Cancel
        </button>
      </div>
    </div>`;

    document.body.insertAdjacentHTML('beforeend', modalHTML);
  }

  window.copyTrackingLink = async function(link) {
    try {
      await navigator.clipboard.writeText(link);
      showToast("✅ Tracking link copied to clipboard!<br>You can send it via WhatsApp, SMS, or email manually.", "success");
    } catch (err) {
      showToast("Failed to copy link", "error");
    }
  };

  window.sendTrackingEmail = async function(orderId, email, trackLink) {
    if (!confirm(`Send tracking email to ${email}?\n\nThis will use 1 credit from your daily 100 limit.`)) return;

    closeTrackingModal();
    showLoading("Sending via Resend...");

    const tracking_id = new URL(trackLink).searchParams.get("id");

    const htmlTemplate = `
    <div style="font-family: Inter, system-ui; max-width: 600px; margin: 0 auto; padding: 40px 20px; background: #0f172a; color: #f1f5f9;">
      <h1 style="color: #6366f1; text-align: center;">Everything Fertility by Himiko</h1>
      <div style="background: #1e293b; padding: 35px; border-radius: 20px; margin: 25px 0;">
        <h2 style="text-align:center; color:#22d3ee;">Tracking Link Ready!</h2>
        <p>Your tracking number: <strong>${tracking_id}</strong></p>
        <p style="text-align:center; margin: 30px 0;">
          <a href="${trackLink}" style="background:#6366f1; color:white; padding:16px 32px; text-decoration:none; border-radius:9999px; font-weight:700; display:inline-block;">
            📍 Track Your Order
          </a>
        </p>
      </div>
      <p style="text-align:center; color:#94a3b8;">Thank you ❤️</p>
    </div>`;

    try {
      const response = await fetch(`${EDGE_FUNCTION_URL}/send-mail`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: email,
          subject: "Your Order Tracking Link ✨",
          html: htmlTemplate
        })
      });

      let result;
      try {
        result = await response.json();
      } catch {
        result = { success: false, error: `HTTP ${response.status}` };
      }

      hideLoading();

      if (result.success) {
        showToast(`✅ Tracking email sent to ${email}`, "success");
      } else {
        const errMsg = (result.error || "").toLowerCase();
        if (response.status === 429 || errMsg.includes("quota") || errMsg.includes("daily")) {
          showToast("❌ Daily limit reached (100 emails). Please try again tomorrow.", "error");
        } else {
          showToast(`Failed: ${result.error || "Unknown error"}`, "error");
        }
      }
    } catch (e) {
      hideLoading();
      showToast("Network error: Cannot reach email service.<br>Is the Edge Function deployed?", "error");
    }
  };

  window.closeTrackingModal = function() {
    const modal = document.getElementById("trackingPreviewModal");
    if (modal) modal.remove();
  };

  /* SEND BROADCAST */
  window.sendBroadcast = async function() {
    const msg = document.getElementById("msg").value.trim();
    const link = document.getElementById("link").value.trim();
    let emailsInput = document.getElementById("emails").value.trim();
    
    if (!msg) return showToast("Message cannot be empty", "error");
    const emails = emailsInput ? emailsInput.split(",").map(e => e.trim()).filter(Boolean) : [];
    if (emails.length === 0) return showToast("Add at least one email", "error");
    
    showLoading("Sending broadcast...");
    
    try {
      const response = await fetch(`${EDGE_FUNCTION_URL}/send-broadcast`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ msg, link, emails })
      });
      
      const result = await response.json();
      hideLoading();
      
      if (result.success) {
        showToast(`✅ Sent to ${emails.length} recipients`, "success");
      } else {
        showToast(`Broadcast failed: ${result.error || "Unknown"}`, "error");
      }
    } catch (e) {
      hideLoading();
      showToast("Network error: Cannot reach broadcast service", "error");
    }
  };
  
  /* TICKETS */
  async function loadTickets() {
    const { data, error } = await supabase.from("tickets").select("*").order("created_at", { ascending: false });
    if (error) return showToast("Failed to load tickets", "error");
    
    document.getElementById("totalTickets").innerText = data?.length || 0;
    
    document.getElementById("tickets").innerHTML = (data || []).map(t => `
      <div class="ticket-card">
        <b>${t.name}</b>
        <div style="font-size:0.9rem; opacity:0.8;">${t.email}</div>
        <div><strong>${t.issue_type}</strong></div>
        <p>${t.message}</p>
        <button onclick="markResolved('${t.id}')" style="background:var(--success); width:auto; padding:10px 18px; border-radius:8px;">
          <i class="fa-solid fa-check"></i> Mark Resolved
        </button>
      </div>
    `).join("");
  }
  
  window.markResolved = async function(id) {
    if (confirm("Mark resolved?")) {
      showLoading();
      await supabase.from("tickets").update({ status: "resolved" }).eq("id", id);
      hideLoading();
      showToast("Ticket resolved");
      loadTickets();
    }
  };
  
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }


let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showToast("💡 You can install this Admin Dashboard as an app!", "success");
});

// Function to trigger install (call it from a button if you want)
window.installPWA = async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') deferredPrompt = null;
  }
};


</script>
